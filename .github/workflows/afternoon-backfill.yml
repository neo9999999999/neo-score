name: Afternoon Backfill (OOS)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "백필 시작일 (YYYY-MM-DD)"
        required: true
        default: "2018-01-01"
      universe:
        description: "분석 종목 수 (전 종목≈3000)"
        required: false
        default: "3000"

permissions:
  contents: write

concurrency:
  group: afternoon-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run afternoon backfill
        env:
          UNIVERSE_N: ${{ inputs.universe }}
          TOP_PICKS: "5"
        run: node scripts/backfill-afternoon-reports.mjs "${{ inputs.start }}"
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/afternoon-history.json public/afternoon
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "Backfill afternoon OOS picks from ${{ inputs.start }}"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "push 성공"; break; fi
              echo "push 실패 ($i/5) — 원격 변경 rebase 후 재시도"
              git pull --rebase origin main || git rebase --abort || true
              sleep $((i * 3))
            done
            if [ "$ok" != "1" ]; then echo "::error::5회 재시도 후에도 push 실패"; exit 1; fi
          fi
