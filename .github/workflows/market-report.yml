name: Daily Market Report

# 아침 리포트 백업 생성 — 주 생성·발송은 07:00 KST "Morning Report"(kakao-send.yml)가 담당.
# 그 실행이 누락될 때를 대비한 백업이며, 이미 생성돼 변경이 없으면 커밋을 생략한다.
# 22:30 UTC = 07:30 KST, 23:00 UTC = 08:00 KST (간밤 미국장 마감 반영)
on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST — 백업(주 실행 누락 대비, 변경 없으면 skip)
    - cron: "0 23 * * *"    # 08:00 KST — 2차 백업
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate market report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/generate-market-report.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market-report.json public/market-report-history.json public/reports
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            DATE=$(date -u -d '+9 hours' +%Y-%m-%d)
            git commit -m "Daily market report ${DATE}"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "push 성공"; break; fi
              echo "push 실패 ($i/5) — 원격 변경 rebase 후 재시도"
              git pull --rebase origin main || git rebase --abort || true
              sleep $((i * 3))
            done
            if [ "$ok" != "1" ]; then echo "::error::5회 재시도 후에도 push 실패"; exit 1; fi
          fi
