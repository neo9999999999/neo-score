<!doctype html>
<html lang="ko" data-theme="q4">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD000">
<title>chocolatebox — 분기별 테마 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ────────────────────────────────────────────────────────────────
   1. 토큰 — 기본값은 Q4(현재 서비스 룩). 분기 값은 themes JSON에서 덮어쓴다.
   ──────────────────────────────────────────────────────────────── */
:root {
  --header-bg: #FFD000; --accent: #D8343F; --accent-soft: #FFE3E8; --accent-soft-ink: #B3202D;
  --cta-ink: #FFD000; --progress: #FFC800; --rank-pill: #2D4BFF;
  --banner-a: #F7C948; --banner-b: #E19A1C; --banner-ink: #7A4300;
  --hero-a: #F6DADC; --hero-b: #E7A9AE;
  --gift: #EE4A5C; --gift-lid: #F4606F; --ribbon: #EDB866; --ribbon-shade: #C98F3E;
  --buy-bg: #4A2C28; --on-dark-accent: #FF7A7A; --gold: #C9A25B;
  --font: 'Noto Sans KR', system-ui, sans-serif;
}

/* ────────────────────────────────────────────────────────────────
   2. 고정 레이어 — 분기가 바뀌어도 그대로인 뼈대·컴포넌트
   ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #E7E4DF; color: #111; font: 400 15px/1.45 var(--font); word-break: keep-all; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #1B64F2; outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.glyph { fill: currentColor; stroke: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 미리보기 패널 (실서비스에는 들어가지 않는다) */
.stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px; }
.panel { width: 270px; flex: none; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #fff; border-radius: 20px; font-size: 14px; }
.panel h1 { margin: 0; font-size: 17px; }
.panel p { margin: 0; color: #5B5B5B; font-size: 13px; }
.panel .quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.panel .quarters button { min-height: 44px; border: 1.5px solid #CFCFCF; border-radius: 12px; background: #fff; font-weight: 700; }
.panel .quarters button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
.panel label { display: flex; flex-direction: column; gap: 4px; color: #3D3D3D; font-weight: 500; }
.panel select { min-height: 44px; padding: 0 10px; border: 1.5px solid #CFCFCF; border-radius: 12px; background: #fff; font: inherit; }
.no-panel .panel { display: none; }

.phone { flex: none; width: 390px; }
.app { position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; overflow: hidden; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .22); }
.screens { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; background: #fff; }
.screen--gray { background: #F2F2F2; }
.app.is-full { height: auto; }
.app.is-full .screens { flex: none; }
.app.is-full .screen { position: static; overflow: visible; }
@media (max-width: 900px) {
  .stage { flex-direction: column-reverse; align-items: center; padding: 12px; gap: 16px; }
  .panel { position: static; width: min(100%, 390px); }
}
@media (max-width: 430px) {
  .stage { padding: 0; gap: 0; }
  .phone, .app { width: 100%; }
  .app { height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  .panel { width: 100%; border-radius: 0; }
}

/* 상단바 */
.topbar { position: relative; display: flex; align-items: center; height: 52px; padding: 0 16px; flex: none; background: #fff; }
.topbar h1 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-size: 17px; font-weight: 500; pointer-events: none; }
.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -12px; padding: 0; border: 0; background: none; }
.iconbtn .ic { width: 26px; height: 26px; }
.rowbtn { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; padding: 0 4px; border: 0; background: none; font-size: 17px; text-align: left; }
.rowbtn .ic { width: 26px; height: 26px; }

/* 마이페이지 */
.banner { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 136px; overflow: hidden; text-align: center; color: #fff;
  background: radial-gradient(circle at 50% 60%, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), repeating-conic-gradient(from 0deg at 50% 60%, var(--banner-a) 0 9deg, var(--banner-b) 9deg 18deg); }
.banner p { margin: 0; font-weight: 900; letter-spacing: -.02em; paint-order: stroke fill; -webkit-text-stroke: 5px var(--banner-ink); text-shadow: 0 3px 0 var(--banner-ink); }
.banner__kicker { font-size: 22px; }
.banner__title { font-size: 52px; line-height: 1.05; }
.rank { display: flex; align-items: center; gap: 12px; width: calc(100% - 40px); height: 56px; margin: 18px 20px 0; padding: 0 20px 0 24px; border: 0; border-radius: 18px; background: #000; color: #fff; text-align: left; }
.rank .name { font-size: 15px; }
.rank .pill { padding: 3px 12px; border-radius: 999px; background: var(--rank-pill); font-size: 14px; font-weight: 700; }
.rank .ic { margin-left: auto; width: 28px; height: 28px; }
.shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 22px 12px 8px; }
.sc { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 44px; border: 0; background: none; font-size: 15px; }
.sc__ic { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; color: var(--fg); background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: 0 6px 12px rgba(0, 0, 0, .15); }
.sc__ic .ic { width: 30px; height: 30px; }
[data-shortcuts="tiles"] .shortcuts { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 18px 20px 4px; }
[data-shortcuts="tiles"] .sc { flex-direction: row; gap: 12px; padding: 12px; border-radius: 16px; background: #F4F4F4; text-align: left; font-weight: 500; }
[data-shortcuts="tiles"] .sc__ic { width: 42px; height: 42px; box-shadow: none; }
[data-shortcuts="tiles"] .sc__ic .ic { width: 22px; height: 22px; }
.notice { margin: 14px 20px 12px; padding: 16px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-soft-ink); text-align: center; font-size: 14px; }
.menu { margin: 0 20px; padding-bottom: 28px; }
.menu__group { border-top: 1px solid #E3E3E3; }
.menu__group:last-child { border-bottom: 1px solid #E3E3E3; }

/* 박스 상세 */
.hero { position: relative; display: grid; place-items: center; height: 372px; background: linear-gradient(180deg, var(--hero-a), var(--hero-b)); }
.hero .iconbtn { position: absolute; top: 8px; left: 16px; margin: 0; }
.hero .art { width: 250px; height: 250px; }
.g-body { fill: var(--gift); } .g-lid { fill: var(--gift-lid); }
.g-rib { fill: var(--ribbon); stroke: var(--ribbon-shade); stroke-width: 2; }
.info { padding: 20px; }
.info h2 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
.info p { margin: 0 0 8px; font-size: 16px; }
.price { font-size: 20px; font-weight: 700; }
.spec { display: grid; grid-template-columns: 84px 1fr; gap: 8px 14px; margin: 0 20px; padding: 18px 0; border-top: 1px solid #E3E3E3; border-bottom: 1px solid #E3E3E3; font-size: 14px; }
.spec dt { color: #6E6E6E; }
.spec dd { margin: 0; }
.bean { margin: 18px 20px 0; padding: 16px; background: #000; color: #fff; text-align: center; font-size: 17px; font-weight: 700; }
.bean span { display: block; font-size: 14px; font-weight: 500; color: var(--on-dark-accent); }
.section-title { margin: 28px 0 16px; text-align: center; font-size: 20px; font-weight: 700; }
.prizes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 14px; }
.prize__img { display: grid; place-items: center; height: 100px; border-radius: 12px; background: radial-gradient(circle at 50% 60%, rgba(255, 150, 60, .6), rgba(255, 150, 60, 0) 62%), #15110F; }
.prize__img .art { width: 76px; height: 76px; }
.prize b { display: block; margin-top: 8px; font-size: 18px; }
.prize span { font-size: 17px; font-weight: 700; }
.buy { position: sticky; bottom: 0; display: block; width: 100%; height: 60px; margin-top: 12px; border: 0; background: var(--buy-bg); color: #fff; font-size: 20px; font-weight: 700; }

/* 앱테크 */
.hbar { display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 14px 0 16px; background: var(--header-bg); font-weight: 700; }
.hbar__group { display: flex; align-items: center; gap: 12px; }
.hitem { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: 0; background: none; font-size: 16px; font-weight: 700; }
.hitem .ic { width: 18px; height: 18px; }
.coin { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #111; color: var(--header-bg); font-size: 13px; font-weight: 900; }
.coin--bean { background: #7A4A1E; color: #fff; }
.coin--tag { border-radius: 6px; background: #E0343F; color: #fff; }
.card { margin: 14px; padding: 18px; border-radius: 22px; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .04); }
.ads { display: flex; align-items: center; gap: 12px; margin: 14px; padding: 14px; border-radius: 22px; background: #EAEAEA; }
.ads .art { width: 82px; height: 82px; flex: none; }
.btn-black { flex: 1; padding: 14px 10px; border: 0; border-radius: 14px; background: #000; color: #fff; text-align: center; font-size: 15px; line-height: 1.35; }
.btn-black strong { color: var(--cta-ink); font-size: 17px; }
.card h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
.share-banner { margin-bottom: 14px; padding: 14px; border-radius: 12px; background: #F1EAFE; color: #6B2FD0; text-align: center; font-size: 16px; font-weight: 700; }
.bar { height: 12px; overflow: hidden; border-radius: 999px; background: #E8E8E8; }
.bar i { display: block; width: 47.5%; height: 100%; border-radius: 999px; background: var(--progress); }
.bar-meta { display: flex; justify-content: space-between; margin: 8px 0 14px; font-size: 13px; color: #555; }
.bar-meta b { color: var(--accent); font-weight: 500; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-dark { min-height: 52px; border: 0; border-radius: 14px; background: #000; color: var(--cta-ink); font-size: 16px; font-weight: 700; }
.btn-line { min-height: 52px; border: 1.5px solid #D3D3D3; border-radius: 14px; background: #fff; font-size: 16px; font-weight: 700; }
.freebox { display: flex; align-items: center; gap: 12px; margin: 14px; padding: 14px 16px; border-radius: 22px; background: #fff; }
.freebox__thumb { display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 12px; background: #FFF4CC; }
.freebox__thumb .art { width: 40px; height: 40px; }
.freebox__txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; }
.freebox__txt b { display: block; font-size: 17px; }
.freebox__txt em { font-style: normal; font-weight: 700; color: var(--accent); }
.btn-pill { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #000; color: #fff; font-size: 14px; font-weight: 700; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px; }
.game { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 6px; border: 0; border-radius: 22px; background: var(--g-bg); text-align: center; }
.game .art { width: 96px; height: 72px; }
.game .txt { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.game .txt b { font-size: 18px; }
.game .desc { font-size: 12.5px; line-height: 1.4; letter-spacing: -.02em; color: var(--g-ink); }
.game .timer { position: absolute; top: 12px; right: 12px; padding: 1px 10px; border-radius: 999px; background: #fff; font-size: 13px; }
[data-games="list"] .games { grid-template-columns: 1fr; }
[data-games="list"] .game { flex-direction: row; gap: 14px; padding: 14px 16px; text-align: left; }
[data-games="list"] .game .art { width: 84px; flex: none; }
[data-games="list"] .game .txt { align-items: flex-start; }
[data-games="rail"] .games { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
[data-games="rail"] .game { flex: 0 0 224px; scroll-snap-align: start; }
.partners { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px 24px; }
.partner { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 10px; border-radius: 22px; background: #fff; text-align: center; }
.partner .logo { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 6px; border-radius: 18px; background: #F1F1F1; font-size: 24px; font-weight: 900; }
.partner b { font-size: 18px; }
.partner span { font-size: 13px; color: #6A6A6A; }

/* 내보관함 */
.vhead { position: relative; display: flex; align-items: center; justify-content: flex-end; height: 52px; padding: 0 16px; background: #fff; }
.vhead h1 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-size: 17px; font-weight: 500; pointer-events: none; }
.vhead button { display: flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: none; color: #6E6E6E; font-size: 14px; }
.vhead .ic { width: 22px; height: 22px; fill: #111; stroke: #fff; }
.subtabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid #E3E3E3; background: #fff; }
.subtabs button { min-height: 48px; border: 0; border-bottom: 2px solid transparent; background: none; color: #6E6E6E; font-size: 16px; }
.subtabs button[aria-current="page"] { border-bottom-color: #111; color: #111; font-weight: 500; }
.howto { display: flex; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 56px; margin-top: 6px; border: 0; background: none; color: #6B2FD0; font-size: 16px; font-weight: 500; }
.howto .ic { width: 20px; height: 20px; }
.synth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 16px 24px; }
.synth { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 14px 16px; border-radius: 22px; background: var(--p-bg); text-align: center; }
.synth .left { position: absolute; top: 14px; left: 14px; padding: 2px 10px; border-radius: 10px; background: #fff; font-size: 13px; }
.synth .ic-big { width: 82px; height: 82px; margin: 14px 0 6px; color: var(--p-btn); fill: currentColor; stroke: none; }
.synth h3 { margin: 0; font-size: 20px; }
.synth .gauge { font-size: 15px; color: var(--p-ink); }
.synth .cost { font-size: 18px; font-weight: 700; color: var(--p-ink); }
.synth button { width: 100%; min-height: 46px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--p-btn); color: var(--p-btn-ink); font-size: 17px; font-weight: 700; }
.synth--dark { grid-column: 1 / -1; overflow: hidden; padding: 64px 16px 16px; background: #000; color: var(--gold); }
.synth--dark .left { z-index: 1; background: #3A3A3A; color: #DADADA; }
.synth--dark .stars { position: absolute; left: 0; top: 28px; width: 100%; height: 120px; color: var(--gold); opacity: .4; }
.synth--dark .stars svg { width: 100%; height: 100%; }
.synth--dark h3, .synth--dark .gauge, .synth--dark .cost, .synth--dark button { position: relative; }
.synth--dark h3 { font-size: 20px; }
.synth--dark .gauge, .synth--dark .cost { color: var(--gold); }
.synth--dark button { background: var(--gold); color: #1A1208; }
.chips { display: flex; gap: 8px; padding: 14px 16px; overflow-x: auto; background: #fff; }
.chip { flex: none; min-height: 44px; padding: 0 18px; border: 1px solid #CFCFCF; border-radius: 999px; background: #fff; color: #6E6E6E; font-size: 15px; }
.chip[aria-pressed="true"] { border-color: #000; background: #000; color: #fff; }
.chip--plus { display: grid; place-items: center; width: 44px; padding: 0; }
.search { display: flex; align-items: center; gap: 10px; height: 50px; margin: 0 16px; padding: 0 18px; border: 1.5px solid #DADADA; border-radius: 999px; background: #fff; }
.search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16px; }
.search input:focus-visible { outline: none; }
.search:focus-within { outline: 3px solid #1B64F2; outline-offset: 2px; }
.search .ic { color: #333; }
.sortbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 14px; background: #fff; }
.sortbar .left { display: flex; align-items: center; gap: 12px; font-size: 15px; }
.sortbar .left button { min-height: 44px; border: 0; background: none; }
.sortbar .count b { color: var(--accent); font-weight: 500; }
.checkall { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; }
.chk { flex: none; width: 26px; height: 26px; margin: 0; accent-color: #000; }
.items { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px; background: #fff; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid #D6D6D6; border-radius: 6px; background: #fff; }
.thumb { display: grid; place-items: center; flex: none; width: 60px; height: 60px; border-radius: 6px; background: var(--t, #EEE); color: rgba(0, 0, 0, .35); }
.thumb .ic { width: 26px; height: 26px; }
.item__txt { min-width: 0; font-size: 15px; line-height: 1.45; }
.item__tag { display: block; font-size: 14px; color: var(--accent); }
.item__tag--muted { color: #6E6E6E; }
.item__price { display: block; margin-top: 2px; }
[data-vault="grid"] .items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
[data-vault="grid"] .item { position: relative; flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; border-radius: 14px; }
[data-vault="grid"] .item .chk { position: absolute; top: 18px; left: 18px; z-index: 1; }
[data-vault="grid"] .thumb { width: 100%; height: auto; aspect-ratio: 1; }
[data-vault="grid"] .thumb .ic { width: 38px; height: 38px; }
.placeholder { display: grid; place-items: center; min-height: 480px; padding: 24px; color: #6E6E6E; text-align: center; }

/* 하단 탭 */
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); flex: none; gap: 2px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid #EDEDED; background: #fff; }
.tabbar[hidden] { display: none; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: 6px 0 4px; border: 0; border-radius: 16px; background: none; color: #222; font-size: 12px; }
.tab .ic { width: 26px; height: 26px; }
.tab[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
.tab[aria-current="page"] .ic { fill: currentColor; }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 6px); width: 8px; height: 8px; border-radius: 50%; background: #E0343F; }
[data-nav="line"] .tab { border-radius: 0; }
[data-nav="line"] .tab[aria-current="page"] { background: none; color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
[data-nav="line"] .tab[aria-current="page"] .ic { fill: none; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M3 12h17M14 5l7 7-7 7"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="none"/><path d="M12 11v6M12 7.5v.2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v11h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8.5 8h7M8.5 12h7M8.5 16h4"/></symbol>

  };
  const art = (name, cls = 'art', style = '') => { const s = h('span', { class: cls, style, 'aria-hidden': 'true' }); s.innerHTML = ART[name]; return s; };

  /* ── 상태 ── */
  const SCREENS = ['apptech', 'mypage', 'box', 'vault-synth', 'vault-items', 'home', 'news'];
  const TABBED = (s) => ['home', 'news', 'apptech', 'vault-synth', 'vault-items'].includes(s);
  const state = {
    quarter: THEMES[params.get('theme')] ? params.get('theme') : 'q4',
    screen: SCREENS.includes(params.get('screen')) ? params.get('screen') : 'apptech',
    games: params.get('games') || 'auto', vault: params.get('vault') || 'auto',
    shortcuts: params.get('shortcuts') || 'auto', nav: params.get('nav') || 'auto'
  };
  const go = (screen) => { state.screen = screen; render(); sync(); };
  const theme = () => THEMES[state.quarter];

  /* ── 화면 ── */
  const back = (to) => h('button', { class: 'iconbtn', type: 'button', 'aria-label': '뒤로', onClick: () => go(to) }, icon('back'));

  function mypage() {
    const t = theme(), ic = t.icons;
    return h('div', { class: 'screen' },
      h('header', { class: 'topbar' }, back('apptech'), h('h1', { text: '마이페이지' })),
      h('section', { class: 'banner', 'aria-label': '이벤트 배너' }, h('p', { class: 'banner__kicker', text: t.banner.kicker }), h('p', { class: 'banner__title', text: t.banner.title })),
      h('button', { class: 'rank', type: 'button' }, h('span', { class: 'name', text: 'ㅂㅂ' }), h('span', { class: 'pill', text: '33위' }), icon('forward')),
      h('div', { class: 'shortcuts' }, CONTENT.shortcuts.map((s, i) =>
        h('button', { class: 'sc', type: 'button', style: `--a:${ic[i].a};--b:${ic[i].b};--fg:${ic[i].fg}` },
          h('span', { class: 'sc__ic' }, icon(s.icon, 'glyph')), h('span', { text: s.label })))),
      h('div', { class: 'notice', text: '배송지 정보 업데이트 안내' }),
      h('nav', { class: 'menu', 'aria-label': '마이페이지 메뉴' }, CONTENT.menu.map((group) =>
        h('div', { class: 'menu__group' }, group.map((label) => h('button', { class: 'rowbtn', type: 'button' }, h('span', { text: label }), icon('forward'))))))
    );
  }

  function boxDetail() {
    const prize = (rank, text) => h('div', { class: 'prize' }, h('div', { class: 'prize__img' }, art('gift')), h('b', { text: rank }), h('span', { text: text }));
    return h('div', { class: 'screen' },
      h('section', { class: 'hero' }, back('apptech'), art('gift')),
      h('div', { class: 'info' },
        h('h2', { text: '찬스업 1877회차' }),
        h('p', { text: '최대 50만원대 상품이 지급됩니다. 단 100박스 한정! 더 좋은 상품을 받으세요!' }),
        h('div', { class: 'price', text: '10,000원' })),
      h('dl', { class: 'spec' },
        h('dt', { text: '상품명' }), h('dd', { text: '찬스업 박스' }),
        h('dt', { text: '결제조건' }), h('dd', {}, '기본 구매: 박스 1개당 카카오빈 100개 차감', h('br'), '추가 구매: 박스 1개당 카카오빈 200개 차감'),
        h('dt', { text: '최대구매가능' }), h('dd', {}, '기본 구매: 최대 10개(회차 오픈 시)', h('br'), '추가 구매: 최대 4개(회차 오픈 1시간 후)', h('br'), '총 14개 박스까지 구매 가능'),
        h('dt', { text: '상품정보' }), h('dd', { text: '하단의 상세설명 참조' }),
        h('dt', { text: '배송비' }), h('dd', { text: '초콜릿박스 배송정책에 따름' })),
      h('div', { class: 'bean' }, '내 보유 카카오빈 : 5개', h('span', { text: '(최대 10개까지 구매가능)' })),
      h('h2', { class: 'section-title', text: '상품구성' }),
      h('div', { class: 'prizes' }, prize('1등', '50~60만원 미만의 상품'), prize('2등', '10~11만원 미만의 상품')),
      h('button', { class: 'buy', type: 'button', text: '1877회차 구매하기' })
    );
  }

  function appTech() {
    const t = theme(), p = t.pastels;
    const hitem = (mark, text, cls) => h('button', { class: 'hitem', type: 'button' }, h('span', { class: 'coin ' + (cls || ''), text: mark }), text, icon('chev'));
    return h('div', { class: 'screen screen--gray' },
      h('header', { class: 'hbar' },
        h('div', { class: 'hbar__group' }, h('span', { class: 'hitem' }, h('span', { class: 'coin', text: 'P' }), '100,209'), hitem('B', '5', 'coin--bean'), hitem('%', '7', 'coin--tag')),
        h('button', { class: 'hitem', type: 'button', onClick: () => go('mypage'), 'aria-label': '마이페이지' }, 'ㅂㅂ', icon('chev'))),
      h('section', { class: 'ads' }, art('ads'), h('button', { class: 'btn-black', type: 'button' }, '무제한참여가능', h('br'), h('strong', { text: '광고보고 카카오빈 1개 받기' }))),
      h('section', { class: 'card' },
        h('h2', { text: '카카오빈 나눔현황' }),
        h('div', { class: 'share-banner', text: '어메이징초박님이 카카오빈 나눔중!' }),
        h('div', { class: 'bar', role: 'img', 'aria-label': '950개 남음, 2000개 중' }, h('i')),
        h('div', { class: 'bar-meta' }, h('span', {}, h('b', { text: '950개' }), ' 남음 / 2000개 나눔'), h('span', { text: '총 13,869,000개 나눔완료' })),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn-dark', type: 'button', text: '나눔하기' }), h('button', { class: 'btn-line', type: 'button', text: '광고보고 나눔받기' }))),
      h('section', { class: 'freebox' },
        h('span', { class: 'freebox__thumb' }, art('gift')),
        h('div', { class: 'freebox__txt' }, h('b', { text: '무료박스' }), '남은시간 01:28:54', h('br'), h('em', { text: '최대 1,000 포인트' })),
        h('button', { class: 'btn-pill', type: 'button', text: '무료박스 받기' })),
      h('div', { class: 'games' }, CONTENT.games.map((g) => {
        const s = p[g.set];
        return h('button', { class: 'game', type: 'button', style: `--g-bg:${s.bg};--g-ink:${s.ink};--art-1:${s.btn};--art-2:${s.ink}` },
          g.timer ? h('span', { class: 'timer', text: g.timer }) : null,
          art(g.art),
          h('span', { class: 'txt' }, h('b', { text: g.title }), h('span', { class: 'desc', style: 'white-space:pre-line', text: g.desc })));
      })),
      h('div', { class: 'partners' },
        h('div', { class: 'partner' }, h('span', { class: 'logo', text: 'A' }), h('b', { text: '에디슨' }), h('span', { text: '다양한 미션을 통한 적립' })),
        h('div', { class: 'partner' }, h('span', { class: 'logo', text: 'R' }), h('b', { text: '리워드롭' }), h('span', { text: '다양한 미션을 통한 적립' })))
    );
  }

  function vault(kind) {
    const t = theme(), p = t.pastels;
    const tab = (label, key) => h('button', { type: 'button', 'aria-current': key === kind ? 'page' : null, onClick: () => go(key === 'synth' ? 'vault-synth' : 'vault-items') }, label);
    const head = [
      h('header', { class: 'vhead' }, h('h1', { text: '내 보관함' }), h('button', { type: 'button' }, '교환포인트', icon('info'))),
      h('nav', { class: 'subtabs', 'aria-label': '보관함 구분' }, tab('보유상품', 'own'), tab('선물함', 'gift'), tab('내보관함', 'items'), tab('합성존', 'synth'))
    ];
    if (kind === 'synth') {
      const cards = CONTENT.steps.map((s, i) => {
        const c = p[i];
        return h('section', { class: 'synth', style: `--p-bg:${c.bg};--p-ink:${c.ink};--p-btn:${c.btn};--p-btn-ink:${c.btnInk}` },
          h('span', { class: 'left', text: '남은 합성 : ' + s.left }), icon(s.icon, 'ic-big'),
          h('h3', { text: s.name }), h('span', { class: 'gauge', text: '합성 충족 게이지' }), h('span', { class: 'cost', text: s.cost }),
          h('button', { type: 'button', text: '합성하기' }));
      });
      cards.push(h('section', { class: 'synth synth--dark' },
        h('span', { class: 'left', text: '남은 합성 : 10' }), art('stars', 'stars'),
        h('h3', { text: '스텝5' }), h('span', { class: 'gauge', text: '합성 충족 게이지' }), h('span', { class: 'cost', text: '298,000P' }),
        h('button', { type: 'button', text: '합성하기' })));
      return h('div', { class: 'screen' }, head,
        h('button', { class: 'howto', type: 'button' }, '쇼케이스 합성존 사용방법', icon('chev')),
        h('div', { class: 'synth-grid' }, cards));
    }
    return h('div', { class: 'screen' }, head,
      h('div', { class: 'chips' }, CONTENT.chips.map((c, i) => h('button', { class: 'chip', type: 'button', 'aria-pressed': String(i === 0), text: c })),
        h('button', { class: 'chip chip--plus', type: 'button', 'aria-label': '필터 추가' }, icon('plus'))),
      h('label', { class: 'search' }, icon('search'), h('span', { class: 'sr-only', text: '상품검색' }), h('input', { type: 'search', placeholder: '상품검색' })),
      h('div', { class: 'sortbar' },
        h('div', { class: 'left' }, h('button', { type: 'button' }, '최신 순 ▾'), h('span', { class: 'count' }, '전체 ', h('b', { text: '407개' }))),
        h('label', { class: 'checkall' }, h('input', { class: 'chk', type: 'checkbox' }), '전체선택')),
      h('div', { class: 'items' }, CONTENT.items.map((it) =>
        h('div', { class: 'item' },
          h('input', { class: 'chk', type: 'checkbox', 'aria-label': it.name + ' 선택' }),
          h('span', { class: 'thumb', style: `--t:${it.tone}` }, icon('gift')),
          h('div', { class: 'item__txt' }, h('span', { class: 'item__tag' + (it.muted ? ' item__tag--muted' : ''), text: it.tag }), it.name, h('span', { class: 'item__price', text: it.price })))))
    );
  }

  const placeholder = (label) => h('div', { class: 'screen' }, h('div', { class: 'placeholder', text: label + ' 화면은 전달받은 스크린샷에 없어 시안에서 제외했어요.' }));

  const BUILD = {
    apptech: appTech, mypage, box: boxDetail, 'vault-synth': () => vault('synth'), 'vault-items': () => vault('items'),
    home: () => placeholder('Home'), news: () => placeholder('뉴스룸')
  };

  const TABS = [
    { label: 'Home', icon: 'home', to: 'home' },
    { label: '뉴스룸', icon: 'news', to: 'news', dot: true },
    { label: '박스구매', icon: 'gift', to: 'box' },
    { label: '내보관함', icon: 'box', to: 'vault-items', on: (s) => s.startsWith('vault') },
    { label: '앱테크', icon: 'diamond', to: 'apptech' }
  ];

  function render() {
    const t = theme();
    Object.entries(t.tokens).forEach(([k, v]) => root.style.setProperty('--' + k, v));
    root.dataset.theme = state.quarter;
    $('meta[name="theme-color"]').setAttribute('content', t.tokens['header-bg']);

    ['games', 'vault', 'shortcuts', 'nav'].forEach((k) => {
      $('#app').dataset[k] = state[k] === 'auto' ? t.layout[k] : state[k];
      $('#sel-' + k).value = state[k];
    });

    $('#screens').replaceChildren(BUILD[state.screen]());
    const tabbar = $('#tabbar');
    tabbar.hidden = !TABBED(state.screen);
    tabbar.replaceChildren(...TABS.map((tab) => {
      const on = tab.on ? tab.on(state.screen) : state.screen === tab.to;
      return h('button', { class: 'tab', type: 'button', 'aria-current': on ? 'page' : null, onClick: () => go(tab.to) }, icon(tab.icon), tab.dot ? h('span', { class: 'dot' }) : null, tab.label);
    }));

    document.querySelectorAll('#quarters button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.q === state.quarter)));
    const sel = $('#sel-screen');
    sel.value = ['apptech', 'mypage', 'box', 'vault-synth', 'vault-items'].includes(state.screen) ? state.screen : 'apptech';
    $('#panel-name').textContent = t.label;
  }

  function sync() {
    const next = new URLSearchParams(location.search);
    next.set('theme', state.quarter);
    next.set('screen', state.screen);
    ['games', 'vault', 'shortcuts', 'nav'].forEach((k) => (state[k] === 'auto' ? next.delete(k) : next.set(k, state[k])));
    try { history.replaceState(null, '', '?' + next.toString()); } catch (e) { /* file:// 등에서는 건너뜀 */ }
  }

  document.querySelectorAll('#quarters button').forEach((b) => b.addEventListener('click', () => { state.quarter = b.dataset.q; render(); sync(); }));
  $('#sel-screen').addEventListener('change', (e) => go(e.target.value));
  ['games', 'vault', 'shortcuts', 'nav'].forEach((k) => $('#sel-' + k).addEventListener('change', (e) => { state[k] = e.target.value; render(); sync(); }));

  if (params.get('preview') === '0') $('#stage').classList.add('no-panel');
  if (params.get('full') === '1') $('#app').classList.add('is-full');
  render();
})();
</script>
</body>
</html>
