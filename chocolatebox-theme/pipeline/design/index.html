<!doctype html>
<html lang="ko" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DC3328">
<title>chocolatebox 시즌 스킨 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ────────────────────────────────────────────────────────────────
   1. 토큰 — 기본값은 '기본' 테마. 시즌 값은 themes JSON에서 derive()로 계산해 덮어쓴다.
   ──────────────────────────────────────────────────────────────── */
:root {
  --ink: #111111; --muted: #6E6E6E; --line: #E6E6E6; --font: 'Noto Sans KR', system-ui, sans-serif;
  --page: #F5F5F5; --header-bg: #DC3328; --cta-bg: #DC3328; --accent: #D82B3A; --accent-soft: #FFE3E0; --accent-soft-ink: #A82020;
  --info-bg: #EAF6FF; --info-ink: #1668C4; --banner-a: #150B2E; --banner-b: #33196F; --banner-ink: #FFFFFF; --mission: #D23750;
  --g-a: #1B0B4D; --g-b: #3A1796; --cell: #5A22D4; --cell-hi: #7440F0; --cell-dim: #260D5E; --taken: #0E6B73; --mine: #22E5FF; --mine-ink: #111111; --stroke: #2B3FD6; --glow: #6E8BFF;
  --rib: #EDB866; --rib-shade: #C98F3E;
}

/* ────────────────────────────────────────────────────────────────
   2. 고정 레이어 — 화면 구조·간격·타입. 시즌이 바뀌어도 그대로다.
   ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #E4E1DC; color: var(--ink); font: 400 15px/1.5 var(--font); word-break: keep-all; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #1B64F2; outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.art { display: block; }
.art svg { display: block; width: 100%; height: 100%; }
.g-body { fill: var(--gift); } .g-lid { fill: var(--lid); }
.g-rib { fill: var(--rib); stroke: var(--rib-shade); stroke-width: 2; }

/* 미리보기 패널 (실서비스에는 들어가지 않는다) */
.stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px; }
.panel { position: sticky; top: 24px; display: flex; flex-direction: column; flex: none; gap: 12px; width: 290px; padding: 18px; border-radius: 20px; background: #fff; font-size: 14px; }
.panel h1 { margin: 0; font-size: 17px; }
.panel p { margin: 0; color: #5B5B5B; font-size: 13px; }
.panel .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.panel .tgrid button { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border: 1.5px solid #D2D2D2; border-radius: 12px; background: #fff; font-size: 13px; font-weight: 700; text-align: left; }
.panel .tgrid button[aria-pressed="true"] { border-color: #111; box-shadow: inset 0 0 0 1px #111; }
.panel .tgrid i { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .15); }
.panel label { display: flex; flex-direction: column; gap: 4px; color: #3D3D3D; font-weight: 500; }
.panel select, .panel input[type="date"] { min-height: 44px; padding: 0 10px; border: 1.5px solid #CFCFCF; border-radius: 12px; background: #fff; font: inherit; }
.panel .guide-link { display: flex; align-items: center; min-height: 44px; color: #111; font-weight: 700; text-decoration: underline; }
.no-panel .panel { display: none; }
.phone { flex: none; width: 390px; }
.app { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 32px; background: #fff; box-shadow: 0 24px 60px rgba(0, 0, 0, .22); }
.screens { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; background: #fff; }
.screen.gray { background: var(--page); }
.screen.has-tabs { padding-bottom: 84px; }
.app.is-full { height: auto; }
.app.is-full .screens { position: static; }
.app.is-full .screen { position: static; overflow: visible; }
@media (max-width: 900px) { .stage { flex-direction: column-reverse; align-items: center; padding: 12px; gap: 16px; } .panel { position: static; width: min(100%, 390px); } }
@media (max-width: 430px) { .stage { padding: 0; gap: 0; } .phone, .app { width: 100%; } .app { height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; } .panel { width: 100%; border-radius: 0; } }

/* 시즌 장식 애니메이션 — 모션 줄이기 설정이면 멈춘다 */
@media (prefers-reduced-motion: no-preference) {
  .fl { animation: fl 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .tw { animation: tw 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
}
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.orn { position: absolute; pointer-events: none; }
.orn svg { display: block; width: 100%; height: 100%; }

/* 공통 컴포넌트 */
.topbar { position: relative; display: flex; align-items: center; height: 56px; padding: 0 16px 0 4px; background: #fff; border-bottom: 1px solid var(--line); }
.topbar h1 { position: absolute; left: 0; right: 0; margin: 0; font-size: 17px; font-weight: 500; text-align: center; pointer-events: none; }
.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; }
.iconbtn .ic { width: 26px; height: 26px; }
.pbal { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 17px; font-weight: 800; }
.pcoin { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #111; color: #fff; font-size: 13px; font-weight: 900; }
.garland { position: absolute; left: 0; right: 0; z-index: 2; height: 26px; pointer-events: none; }
.garland svg { display: block; width: 100%; height: 100%; }

/* ── 포인트샵 ── */
.info { margin: 16px 16px 0; padding: 14px 12px; border-radius: 14px; background: var(--info-bg); color: var(--info-ink); font-size: 13.5px; line-height: 1.55; text-align: center; }
.cats { display: flex; gap: 8px; padding: 20px 16px 0; overflow-x: auto; }
.cat { flex: none; width: 60px; padding: 0; border: 0; background: none; font-size: 13px; color: #4A4A4A; text-align: center; }
.cat .ci { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%; background: #F3F3F3; }
.cat .ci svg { width: 34px; height: 34px; }
.cat[aria-pressed="true"] { color: #111; font-weight: 800; }
.cat[aria-pressed="true"] .ci { background: #111; }
.search { display: flex; align-items: center; gap: 10px; height: 46px; margin: 18px 16px 0; padding: 0 16px; border: 1.5px solid #D6D6D6; border-radius: 999px; background: #fff; }
.search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16px; }
.search input::placeholder { color: #767676; }
.search input:focus-visible { outline: none; }
.search:focus-within { outline: 3px solid #1B64F2; outline-offset: 2px; }
.search .ic { color: #333; }
.sort { display: flex; align-items: center; gap: 14px; margin: 22px 16px 14px; font-size: 15px; }
.sort button { min-height: 44px; padding: 0; border: 0; background: none; }
.sort b { color: var(--accent); font-weight: 500; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 12px; padding: 0 14px 28px; }
.prod { display: block; padding: 0; border: 0; background: none; text-align: left; }
.prod .tile { aspect-ratio: 176 / 116; overflow: hidden; border-radius: 12px; background: #F2F2F2; }
.prod .tt { margin-top: 10px; font-size: 15px; font-weight: 800; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod .st { font-size: 13px; color: var(--muted); }
.prod .pr { font-size: 15px; font-weight: 800; color: var(--accent); }
.prod .sold { font-size: 15px; font-weight: 800; color: var(--c2-tag); }

/* ── 박스구매 홈 ── */
.hbar { position: relative; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 16px; overflow: hidden; background: var(--header-bg); color: #fff; font-size: 16px; font-weight: 800; }
.hbar > * { position: relative; z-index: 1; }
.hbar .orn { inset: 0; z-index: 0; }
.hbar .hi { display: flex; align-items: center; gap: 5px; min-height: 44px; padding: 0; border: 0; background: none; font-weight: 800; }
.hbar .hi .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.hcoin { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: var(--header-bg); font-size: 13px; font-weight: 900; }
.hcoin.bean { background: #4B241A; color: #fff; }
.hcoin.tag { border-radius: 6px; background: #fff; color: var(--header-bg); font-size: 12px; }
.hbar .right { margin-left: auto; }
.banner { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 172px; margin: 16px 16px 0; padding: 18px 16px 16px; overflow: hidden; border-radius: 24px; color: var(--banner-ink); background: linear-gradient(160deg, var(--banner-a), var(--banner-b)); }
.banner .orn { inset: 0; }
.banner .bt { position: relative; margin: 10px 0 0; font-size: 26px; font-weight: 900; line-height: 1.2; letter-spacing: -.02em; text-align: center; text-shadow: 0 3px 0 rgba(0, 0, 0, .28); }
.banner .btn { position: relative; display: block; width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #fff; color: var(--accent); font-size: 18px; font-weight: 800; }
.boxgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; padding: 16px 16px 28px; }
.bcard { display: block; padding: 0; border: 0; background: none; text-align: left; }
.bimg { position: relative; aspect-ratio: 172 / 188; overflow: hidden; border-radius: 24px; background: linear-gradient(160deg, var(--ca), var(--cb)); }
.bimg .gift { position: absolute; inset: 14% 12% 8%; }
.bimg .orn { inset: 0; }
.pill { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%); padding: 8px 6px; border-radius: 999px; background: rgba(255, 255, 255, .86); color: #111; font-size: 15px; font-weight: 800; text-align: center; }
.bcard .lb { margin-top: 10px; font-size: 16px; font-weight: 500; color: var(--ctag); }
.bcard .ds { font-size: 14.5px; line-height: 1.45; color: #222; }

/* ── 상품상세 ── */
.hero { position: relative; height: 300px; overflow: hidden; background: linear-gradient(180deg, #CFCFCF, #8F8F8F); }
.hero .back { position: absolute; top: 8px; left: 4px; z-index: 3; color: #fff; }
.hero .art { position: absolute; inset: 0; }
.hero .orn { right: 0; bottom: 0; width: 220px; height: 120px; z-index: 2; }
.dtitle { margin: 0; padding: 22px 16px 0; font-size: 16px; font-weight: 400; line-height: 1.45; }
.dtitle em { font-style: normal; color: var(--accent); }
.dprice { padding: 8px 16px 18px; font-size: 20px; font-weight: 900; }
.dtabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.dtabs button { min-height: 48px; border: 0; border-bottom: 3px solid transparent; background: none; color: #767676; font-size: 16px; }
.dtabs button[aria-current="true"] { border-bottom-color: #111; color: #111; font-weight: 500; }
.notice { margin: 16px; padding: 16px; border-radius: 12px; background: #F6F6F6; }
.notice b { display: block; margin-bottom: 8px; color: #4A1F1F; font-size: 16px; font-weight: 900; letter-spacing: .06em; }
.notice p { margin: 0; font-size: 14px; line-height: 1.6; color: #333; }
.dimg { display: grid; place-items: center; height: 260px; margin: 20px 40px; overflow: hidden; background: #F4F4F4; }
.dimg svg { width: 70%; height: 90%; }
.dtext { margin: 0 24px 24px; font-size: 13.5px; color: #555; line-height: 1.7; }
.cta { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; overflow: hidden; border: 0; background: var(--cta-bg); color: #fff; font-size: 20px; font-weight: 800; }
.cta .orn { inset: 0; }
.cta span { position: relative; }

/* ── 뉴스룸 ── */
.ntabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); background: #fff; }
.ntabs button { position: relative; min-height: 48px; border: 0; border-bottom: 3px solid transparent; background: none; color: #767676; font-size: 14.5px; }
.ntabs button[aria-current="true"] { border-bottom-color: #111; color: #111; font-weight: 800; }
.ntabs .dot { position: absolute; top: 12px; right: 12px; width: 6px; height: 6px; border-radius: 50%; background: #E0343F; }
.has-garland .ntabs { margin-top: 22px; }
.banner.has-emblem .bt { padding-right: 76px; text-align: left; }
.mission.has-emblem b { padding-right: 40px; }
.car { position: relative; height: 330px; margin-top: 14px; overflow: hidden; }
.ncard { position: absolute; top: 8px; width: 300px; height: 300px; padding: 20px; border-radius: 26px; color: #fff; text-align: center; box-shadow: 0 10px 28px rgba(0, 0, 0, .16); }
.ncard.c0 { left: 45px; background: var(--n0); } .ncard.c1 { left: -267px; background: var(--n1); } .ncard.c2 { left: 357px; background: var(--n2); }
.ncard .blob { width: 190px; height: 170px; margin: 0 auto 10px; }
.ncard .who { font-size: 12px; font-weight: 500; }
.ncard .nm { margin: 2px 0; font-size: 17px; font-weight: 800; line-height: 1.35; }
.ncard .rp { font-size: 14px; font-weight: 500; }
.dots { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #CFCFCF; }
.dots i:first-child { width: 18px; border-radius: 3px; background: #111; }
.nh { margin: 22px 16px 12px; font-size: 16px; font-weight: 800; }
.rows { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 92px; padding: 12px; border: 1.5px solid #E4E4E4; border-radius: 14px; background: #fff; }
.row .th { flex: none; width: 66px; height: 66px; overflow: hidden; border-radius: 6px; background: #D5D5D5; }
.row .tx { min-width: 0; font-size: 13.5px; line-height: 1.4; }
.row .tx small { display: block; font-size: 12px; font-weight: 700; }
.row .tx b { display: block; margin-top: 2px; font-size: 16px; }
.row .when { position: absolute; right: 12px; bottom: 8px; font-size: 12px; color: var(--muted); }
.row.fill { border-color: transparent; background: var(--tc); color: #fff; }
.row.fill .when { color: #fff; }
.row.line { border: 2px solid var(--tc); }
.nnote { margin: 14px 16px 0; padding: 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-soft-ink); font-size: 13px; text-align: center; }
.mission { position: relative; margin: 16px 16px 0; padding: 16px 14px 14px; overflow: hidden; border-radius: 20px; background: var(--mission); color: #fff; text-align: center; }
.mission .orn { inset: 0; }
.mission b { position: relative; display: block; margin-bottom: 12px; font-size: 18px; font-weight: 900; }
.mission button { position: relative; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #fff; color: var(--accent); font-size: 18px; font-weight: 800; }

/* ── 구매하기(번호 선택) ── */
.buy { background: linear-gradient(180deg, var(--g-a), var(--g-b)); color: #fff; }
.btop { position: relative; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px 0 4px; }
.btop h1 { position: absolute; left: 0; right: 0; margin: 0; font-size: 16px; font-weight: 500; text-align: center; pointer-events: none; }
.btop .iconbtn { color: #fff; }
.bbal { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; color: #D8C8FF; }
.bbal i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #4B241A; color: #fff; font-size: 12px; font-style: normal; font-weight: 900; }
.bhero { position: relative; height: 196px; }
.bhero svg { display: block; width: 100%; height: 100%; }
.bsub { margin: -8px 0 14px; font-size: 16px; font-weight: 800; text-align: center; }
.ngrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 0 20px 20px; }
.nc { height: 58px; border: 0; border-radius: 10px; background: linear-gradient(180deg, var(--cell-hi), var(--cell)); box-shadow: 0 3px 0 rgba(0, 0, 0, .28); color: #fff; font-size: 20px; font-weight: 500; }
.nc:disabled { background: var(--cell-dim); box-shadow: none; color: rgba(255, 255, 255, .22); cursor: default; }
.nc.taken { background: var(--taken); color: rgba(255, 255, 255, .45); box-shadow: none; }
.nc[aria-pressed="true"] { background: var(--mine); color: var(--mine-ink); font-weight: 900; box-shadow: 0 0 0 2px #fff inset, 0 0 16px var(--mine); }
.sheet { position: sticky; bottom: 0; z-index: 4; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: #fff; color: #111; box-shadow: 0 -10px 30px rgba(0, 0, 0, .3); }
.sheet .sh { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.sheet .sh b { font-size: 16px; font-weight: 800; }
.sheet .sh em { margin-left: 4px; font-style: normal; font-size: 12px; color: var(--accent); }
.sheet .sh span { font-size: 13px; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 14px; }
.slot { display: grid; place-items: center; height: 36px; border-radius: 8px; border: 1.5px dashed #C9C9C9; font-size: 15px; font-weight: 800; color: #999; }
.slot.on { border: 0; background: #FFC800; color: #111; }
.slot.old { border: 0; background: #FFF0B8; color: #6A5000; }
.sheet .next { width: 100%; height: 54px; border: 0; border-radius: 999px; background: #000; color: #fff; font-size: 17px; font-weight: 800; }
.floatpill { position: sticky; bottom: 92px; z-index: 3; width: max-content; margin: -40px auto 6px; padding: 8px 18px; border-radius: 999px; background: rgba(255, 255, 255, .88); color: #111; font-size: 13px; font-weight: 800; }

.prod .tile { display: block; }
.prod .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cat .ci.img { overflow: hidden; background: none; }
.cat .ci img { display: block; width: 56px; height: 56px; }
.bimg .real { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bimg .pill { background: rgba(255, 255, 255, .97); box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
.sticker { position: absolute; top: 10px; left: 10px; z-index: 2; width: 34px; height: 34px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .2)); }
.sticker svg { display: block; width: 100%; height: 100%; }
.row img.th { object-fit: cover; }
.hero .back { color: #111; }
.banner.img { min-height: 0; padding: 0; background: #150B2E; }
.banner.img img { display: block; width: 100%; height: auto; }
.banner .ghostbtn { position: absolute; left: 3%; right: 3%; bottom: 6%; height: 29%; border: 0; border-radius: 14px; background: transparent; }
.sb { min-height: 184px; }
.sb .bokeh { position: absolute; inset: 0; background: radial-gradient(circle at 84% 34%, var(--glow) 0, rgba(0, 0, 0, 0) 46%), radial-gradient(circle at 8% 100%, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 40%); opacity: .55; }
.bt3d { position: relative; display: flex; flex-direction: column; align-items: flex-start; margin: 6px 0 14px; font-size: 30px; line-height: 1.1; font-weight: 900; letter-spacing: -.03em; color: #fff; transform: rotate(-3deg); transform-origin: left center; text-shadow: 0 2px 0 rgba(0, 0, 0, .2), 0 4px 0 rgba(0, 0, 0, .2), 0 6px 0 rgba(0, 0, 0, .16), 0 12px 18px rgba(0, 0, 0, .35); }
.bt3d .hl { color: var(--hl, #FFD84D); }
.placeholder { display: grid; place-items: center; min-height: 560px; padding: 24px; color: var(--muted); text-align: center; }

/* ── premium season layer ── */
.bframe { position: relative; border-radius: 24px; }
.bframe.on { padding: 3px; border-radius: 27px; background: var(--foil); box-shadow: 0 14px 26px -14px var(--foil-sh), 0 2px 5px rgba(0, 0, 0, .06); }
.bframe.on::after { content: ''; position: absolute; inset: 3px; z-index: 2; border-radius: 24px; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .7), inset 0 1px 10px rgba(255, 255, 255, .25); pointer-events: none; }
.bframe .charm { position: absolute; top: -16px; left: -12px; z-index: 3; width: 56px; height: 56px; filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .28)); transform: rotate(-8deg); }
.bframe .charm.r { left: auto; right: -12px; transform: rotate(8deg) scaleX(-1); }
.sb3 { min-height: 196px; padding: 0 16px 16px; justify-content: flex-end; background: radial-gradient(120% 90% at 50% 0%, var(--banner-b) 0%, var(--banner-a) 70%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px rgba(255, 255, 255, .07), 0 14px 30px -16px var(--banner-a); }

  function buy() {
    const t = T(), o = t.orn;
    const DIM = new Set([3, 4, 8, 12, 19, 20, 22, 35, 46, 53, 54, 62, 63, 74, 82, 83, 84]);
    const TAKEN = new Set([5, 28]);
    const sel = new Set([29, 30]);
    const ALLOW = 12;
    const slotsEl = h('div', { class: 'slots' });
    const pillEl = h('div', { class: 'floatpill' });
    const cntEl = h('span');
    const next = h('button', { class: 'next', type: 'button', text: '다음' });
    const cells = [];
    const refresh = () => {
      const mine = [5, 28, ...[...sel].sort((a, b) => a - b)];
      const slots = Math.max(10, mine.length + 1);
      slotsEl.replaceChildren(...Array.from({ length: slots }, (_, i) => (i < mine.length ? h('div', { class: 'slot ' + (i < 2 ? 'old' : 'on'), text: String(mine[i]) }) : h('div', { class: 'slot', 'aria-hidden': 'true', text: '+' }))));
      const left = ALLOW - mine.length;
      cntEl.textContent = `${left}개 구매가능`; pillEl.textContent = `${left}개 구매가능`;
      cells.forEach(([n, b]) => b.setAttribute('aria-pressed', String(sel.has(n))));
    };
    const grid = h('div', { class: 'ngrid' }, Array.from({ length: 100 }, (_, i) => {
      const n = i + 1;
      const b = h('button', { class: 'nc' + (TAKEN.has(n) ? ' taken' : ''), type: 'button', disabled: DIM.has(n) || TAKEN.has(n) || null, text: String(n), 'aria-label': n + '번 박스', 'aria-pressed': 'false' });
      b.addEventListener('click', () => { if (sel.has(n)) sel.delete(n); else if (sel.size + 2 < ALLOW) sel.add(n); refresh(); });
      cells.push([n, b]);
      return b;
    }));
    const heroSvg = (() => {
      const rays = Array.from({ length: 20 }, (_, i) => { const a0 = (i * 18 - 90) * Math.PI / 180, a1 = ((i + 1) * 18 - 90) * Math.PI / 180; return i % 2 ? '' : `<path d="M195 96L${(195 + 330 * Math.cos(a0)).toFixed(1)} ${(96 + 330 * Math.sin(a0)).toFixed(1)}L${(195 + 330 * Math.cos(a1)).toFixed(1)} ${(96 + 330 * Math.sin(a1)).toFixed(1)}Z" fill="#fff" opacity=".10"/>`; }).join('');
      const sc = on(o) ? scatter(o.scatter, 390, 196, 24, 17, o.colors, { size: [.8, 1.5] }) : scatter(['star', 'dot'], 390, 196, 18, 17, ['#FFE9A0', '#FFFFFF'], { size: [.6, 1.1] });
      return `<svg viewBox="0 0 390 196" aria-hidden="true"><defs><radialGradient id="hg" cx="50%" cy="48%" r="55%"><stop offset="0" stop-color="var(--glow)" stop-opacity=".75"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient></defs><rect width="390" height="196" fill="url(#hg)"/>${rays}<ellipse cx="195" cy="176" rx="160" ry="16" fill="var(--glow)" opacity=".35"/>${R3D[state.id] ? '' : sc}</svg>${R3D[state.id] ? `<img class="r3d" src="assets/r3d-banner-${state.id}.png" alt="">` : ''}<svg class="ttl" viewBox="0 0 390 196" aria-hidden="true"><text x="195" y="92" text-anchor="middle" font-size="54" font-weight="900" font-style="italic" fill="url(#gold)" style="stroke:var(--stroke)" stroke-width="8" paint-order="stroke" stroke-linejoin="round" font-family="Noto Sans KR, sans-serif">CHANCE</text><g transform="translate(195 96)"><rect x="-26" y="-14" width="52" height="28" rx="9" fill="#fff" style="stroke:var(--stroke)" stroke-width="3"/><text x="0" y="8" text-anchor="middle" font-size="21" font-weight="900" style="fill:var(--stroke)" font-family="Noto Sans KR, sans-serif">UP</text></g><text x="195" y="146" text-anchor="middle" font-size="50" font-weight="900" font-style="italic" fill="url(#gold)" style="stroke:var(--stroke)" stroke-width="8" paint-order="stroke" stroke-linejoin="round" font-family="Noto Sans KR, sans-serif">PREMIUM</text></svg>`;
    })();
    refresh();
    return h('div', { class: 'screen buy' },
      h('header', { class: 'btop' }, h('button', { class: 'iconbtn', type: 'button', 'aria-label': '닫기', onClick: () => go('boxes') }, icon('close')), h('h1', { text: '2회차 구매하기' }), h('div', { class: 'bbal' }, h('i', { text: 'B' }), '240')),
      h('div', { class: 'garland', style: 'top:52px', html: garlandFor(o) }),
      h('div', { class: 'bhero', html: heroSvg }),
      h('p', { class: 'bsub', text: '찬스업 프리미엄 박스' }),
      grid, pillEl,
      h('div', { class: 'sheet' }, h('div', { class: 'sh' }, h('div', {}, h('b', { text: '박스 선택하기' }), h('em', { text: '(1등 확률 4%)' })), cntEl), slotsEl, next)
    );

  const placeholder = (label) => h('div', { class: 'screen has-tabs' }, h('div', { class: 'placeholder', text: label + ' 화면은 이번 요청의 스크린샷에 없어 제외했어요.' }));
  const BUILD = { boxes, shop, detail, news, buy, home: () => placeholder('Home'), mypage: () => placeholder('내보관함·앱테크') };
  const TABS = [
    { label: 'Home', icon: 'home', to: 'home' }, { label: '뉴스룸', icon: 'news', to: 'news', dot: true },
    { label: '박스구매', icon: 'gift', to: 'boxes', on: (s) => ['boxes', 'shop'].includes(s) },
    { label: '내보관함', icon: 'box', to: 'mypage' }, { label: '앱테크', icon: 'diamond', to: 'mypage' }

  const fmtWindow = (w) => (w ? `${w[0].replace('-', '/')} ~ ${w[1].replace('-', '/')}` : '날짜와 무관');
  function render() {
    const id = effective(), t = THEMES[id];
    Object.entries(derive(t.seeds)).forEach(([k, v]) => root.style.setProperty(k, v));
    root.dataset.theme = id; state.id = id;

    $('#screens').replaceChildren(BUILD[state.screen]());
    const tabbed = TABBED(state.screen);
    const tabbar = $('#tabbar');
    tabbar.hidden = !tabbed;
    tabbar.replaceChildren(...TABS.map((tab) => { const on = tab.on ? tab.on(state.screen) : state.screen === tab.to; return h('button', { class: 'tab', type: 'button', 'aria-current': on ? 'page' : null, onClick: () => go(tab.to) }, icon(tab.icon), tab.dot ? h('span', { class: 'dot' }) : null, tab.label); }));
    document.querySelectorAll('#tgrid button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === state.theme)));

  }
  function sync() {

    next.set('theme', state.theme); next.set('screen', state.screen);
    state.date === todayKst() ? next.delete('date') : next.set('date', state.date);
    try { history.replaceState(null, '', '?' + next.toString()); } catch (e) { /* file:// 등에서는 건너뜀 */ }
  }

  /* 패널 */
  const tg = $('#tgrid');
  tg.append(h('button', { type: 'button', 'data-t': 'auto', onClick: () => { state.theme = 'auto'; render(); sync(); } }, h('i', { style: 'background:conic-gradient(#C0262D,#1F6B3A,#0E7FB5,#B5561F,#C0262D)' }), '자동(날짜)'));
  ['default', ...DATA.order].forEach((id) => tg.append(h('button', { type: 'button', 'data-t': id, onClick: () => { state.theme = id; render(); sync(); } }, h('i', { style: `background:${derive(THEMES[id].seeds)['--header-bg']}` }), THEMES[id].name)));
  $('#sel-screen').addEventListener('change', (e) => go(e.target.value));
  $('#inp-date').addEventListener('change', (e) => { if (e.target.value) { state.date = e.target.value; render(); sync(); } });
  if (params.get('preview') === '0') $('#stage').classList.add('no-panel');
  if (params.get('full') === '1') $('#app').classList.add('is-full');
  render();
})();
