name: Afternoon Report (Next-day picks)

# 매일 15:00 KST(06:00 UTC) — 장 마감 직전, 익일 상승 종목 예측
on:
  schedule:
    - cron: "0 6 * * 1-5"   # 15:00 KST — 주 실행
    - cron: "0 7 * * 1-5"   # 16:00 KST — 백업(스케줄 누락 대비, 변경 없으면 skip)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: afternoon-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate afternoon report
        env:
          UNIVERSE_N: "500"
          TOP_PICKS: "5"
        run: node scripts/generate-afternoon-report.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/afternoon-report.json public/afternoon-history.json public/afternoon
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            DATE=$(date -u -d '+9 hours' +%Y-%m-%d)
            git commit -m "Afternoon next-day picks ${DATE}"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "push 성공"; break; fi
              echo "push 실패 ($i/5) — 원격 변경 rebase 후 재시도"
              git pull --rebase origin main || git rebase --abort || true
              sleep $((i * 3))
            done
            if [ "$ok" != "1" ]; then echo "::error::5회 재시도 후에도 push 실패"; exit 1; fi
          fi
