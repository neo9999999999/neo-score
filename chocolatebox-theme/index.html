<!doctype html>
<html lang="ko" data-theme="q1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F5">
<title>chocolatebox 개편 시안 — 분기 테마</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ────────────────────────────────────────────────────────────────
   1. 토큰 — 기본값은 Q1. 분기 값은 themes JSON에서 덮어쓴다.
   ──────────────────────────────────────────────────────────────── */
:root {
  /* 브랜드(고정) */
  --brand: #FFD000; --brand-ink: #14110D; --ink: #14110D; --muted: #6B655C; --surface: #FFFFFF;
  --font: 'Noto Sans KR', system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(30, 20, 10, .05), 0 8px 24px rgba(30, 20, 10, .07);
  /* 시즌(교체) */
  --bg: #FFF7F5; --line: #F0E3E0;
  --season: #B3294F; --season-soft: #FFE8EE; --season-ink: #8F1F3E;
  --hero-a: #7A1B3A; --hero-b: #C23A5E; --glow: #FF9DB5; --gold: #E3B4A6;
  --gift: #D64A6B; --gift-lid: #E8647F; --ribbon: #F6DDB8; --ribbon-shade: #D2A872;
  --piece-a: #C25468; --piece-a-in: #D26A7D; --piece-b: #5A3626; --piece-b-in: #6B4330; --piece-c: #EADBC5; --piece-c-in: #F3E8D6;
}

/* ────────────────────────────────────────────────────────────────
   2. 고정 레이어 — 타입 스케일, 버튼, 카드, 하단 탭
   ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #E4E1DC; color: var(--ink); font: 400 15px/1.5 var(--font); word-break: keep-all; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #1B64F2; outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.fill { fill: currentColor; stroke: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.art svg { display: block; width: 100%; height: 100%; }
.pc-a { fill: var(--piece-a); } .pc-a-in { fill: var(--piece-a-in); }
.pc-b { fill: var(--piece-b); } .pc-b-in { fill: var(--piece-b-in); }
.pc-c { fill: var(--piece-c); } .pc-c-in { fill: var(--piece-c-in); }
.g-body { fill: var(--gift); } .g-lid { fill: var(--gift-lid); }
.g-rib { fill: var(--ribbon); stroke: var(--ribbon-shade); stroke-width: 2; }

/* 미리보기 패널 (실서비스에는 들어가지 않는다) */
.stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px; }
.panel { position: sticky; top: 24px; display: flex; flex-direction: column; flex: none; gap: 12px; width: 270px; padding: 18px; border-radius: 20px; background: #fff; font-size: 14px; }
.panel h1 { margin: 0; font-size: 17px; }
.panel p { margin: 0; color: #5B5B5B; font-size: 13px; }
.panel .quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.panel .quarters button { min-height: 44px; border: 1.5px solid #CFCFCF; border-radius: 12px; background: #fff; font-weight: 700; }
.panel .quarters button[aria-pressed="true"] { border-color: #111; background: #111; color: #fff; }
.panel label { display: flex; flex-direction: column; gap: 4px; color: #3D3D3D; font-weight: 500; }
.panel select { min-height: 44px; padding: 0 10px; border: 1.5px solid #CFCFCF; border-radius: 12px; background: #fff; font: inherit; }
.panel .guide-link { display: flex; align-items: center; min-height: 44px; color: #111; font-weight: 700; text-decoration: underline; }
.no-panel .panel { display: none; }
.phone { flex: none; width: 390px; }
.app { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 32px; background: var(--bg); box-shadow: 0 24px 60px rgba(0, 0, 0, .22); }
.screens { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); transition: background-color .3s; }
.app.has-tabs .screen { padding-bottom: 104px; }
.app.is-full { height: auto; }
.app.is-full .screens { position: static; }
.app.is-full .screen { position: static; overflow: visible; }
@media (max-width: 900px) { .stage { flex-direction: column-reverse; align-items: center; padding: 12px; gap: 16px; } .panel { position: static; width: min(100%, 390px); } }
@media (max-width: 430px) { .stage { padding: 0; gap: 0; } .phone, .app { width: 100%; } .app { height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; } .panel { width: 100%; border-radius: 0; } }

/* 타이포 */
.h1 { margin: 0; font-size: 24px; line-height: 1.3; font-weight: 900; letter-spacing: -.02em; }
.h2 { margin: 0; font-size: 20px; line-height: 1.35; font-weight: 800; letter-spacing: -.01em; }
.h3 { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 700; }
.cap { font-size: 13px; color: var(--muted); }
.section { margin: 28px 16px 0; }
.section__head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 12px; }
.section__head a, .section__head button { min-height: 44px; padding: 0; border: 0; background: none; color: var(--season-ink); font-size: 14px; font-weight: 700; text-decoration: none; }

/* 버튼 · 카드 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 0 22px; border: 0; border-radius: 999px; font-size: 16px; font-weight: 800; }
.btn--primary { background: var(--brand); color: var(--brand-ink); }
.btn--dark { background: var(--ink); color: var(--brand); }
.btn--soft { background: var(--season-soft); color: var(--season-ink); }
.btn--sm { min-height: 44px; padding: 0 18px; font-size: 14px; }
.btn--block { width: 100%; }
.card { margin: 0 16px; padding: 18px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
.chipx { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--season-soft); color: var(--season-ink); font-size: 12px; font-weight: 700; }
.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; }
.iconbtn .ic { width: 26px; height: 26px; }
.topbar { position: relative; display: flex; align-items: center; height: 56px; padding: 0 8px; }
.topbar h1 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-size: 17px; font-weight: 700; pointer-events: none; }
.avatar { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--season-soft); color: var(--season-ink); font-size: 15px; font-weight: 800; }

/* ── 앱테크 ── */
.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
.top .hello { font-size: 13px; color: var(--muted); }
.top .name { font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
.hero-card { position: relative; margin: 8px 16px 0; padding: 22px 20px 20px; overflow: hidden; border-radius: 30px; color: #fff; background: linear-gradient(150deg, var(--hero-a), var(--hero-b)); }
.hero-card .scene { position: absolute; right: -14px; top: -8px; width: 236px; height: 190px; pointer-events: none; }
.hero-card .scene svg { width: 100%; height: 100%; }
.hero-card .body { position: relative; }
.hero-card .label { font-size: 14px; font-weight: 500; }
.hero-card .points { margin-top: 2px; font-size: 38px; line-height: 1.15; font-weight: 900; letter-spacing: -.02em; }
.hero-card .points small { margin-left: 4px; font-size: 20px; font-weight: 700; }
.mini { display: flex; gap: 8px; margin-top: 14px; }
.mini button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 14px; background: rgba(0, 0, 0, .2); color: #fff; font-size: 14px; font-weight: 700; }
.mini .ic { width: 16px; height: 16px; }
.hero-card .cta { position: relative; margin-top: 16px; }
.hc-avatar { display: none; }
.ads-card { display: none; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 16px 0; padding: 14px 16px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
.ads-card b { display: block; font-size: 16px; }
[data-hero="bar"] .top { display: none; }
[data-hero="bar"] .hero-card { display: flex; align-items: center; justify-content: space-between; margin: 0; padding: 10px 16px; border-radius: 0; background: var(--brand); color: var(--brand-ink); }
[data-hero="bar"] .hero-card .scene, [data-hero="bar"] .hero-card .label, [data-hero="bar"] .hero-card .cta { display: none; }
[data-hero="bar"] .hero-card .points { margin: 0; font-size: 22px; }
[data-hero="bar"] .hero-card .points small { font-size: 14px; }
[data-hero="bar"] .mini { margin: 0; }
[data-hero="bar"] .mini button { background: rgba(0, 0, 0, .08); border-color: transparent; color: var(--brand-ink); }
[data-hero="bar"] .hc-avatar { display: grid; }
[data-hero="bar"] .ads-card { display: flex; }
.row-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.row-card .thumb { display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 18px; background: var(--season-soft); }
.row-card .thumb .art { width: 40px; height: 40px; }
.row-card .txt { flex: 1; min-width: 0; }
.row-card .txt b { display: block; font-size: 17px; }
.row-card .txt span { font-size: 13px; color: var(--muted); }
.row-card .txt em { font-style: normal; font-weight: 700; color: var(--season); }
.share .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.share p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.share p b { color: var(--season-ink); }
.bar { height: 12px; overflow: hidden; border-radius: 999px; background: var(--line); }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
.bar-meta { display: flex; justify-content: space-between; margin: 8px 0 14px; font-size: 13px; color: var(--muted); }
.bar-meta b { color: var(--season); font-weight: 700; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.game { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 176px; padding: 16px; border: 0; border-radius: 26px; background: var(--g-bg); color: var(--ink); text-align: left; }
.game .art { width: 76px; height: 64px; margin-bottom: auto; }
.game .txt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.game b { margin-top: 10px; font-size: 18px; font-weight: 800; }
.game .desc { font-size: 12.5px; line-height: 1.4; letter-spacing: -.02em; color: var(--g-ink); }
.game .timer { position: absolute; top: 14px; right: 14px; padding: 1px 10px; border-radius: 999px; background: rgba(255, 255, 255, .85); font-size: 12px; font-weight: 700; }
[data-games="list"] .games { grid-template-columns: 1fr; }
[data-games="list"] .game { flex-direction: row; align-items: center; gap: 14px; min-height: 0; padding: 14px 18px; }
[data-games="list"] .game .art { width: 64px; margin: 0; }
[data-games="list"] .game b { margin: 0; }
[data-games="list"] .game .txt { display: flex; flex-direction: column; }
[data-games="rail"] .games { display: flex; margin: 0 -16px; padding: 0 16px 6px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; }
[data-games="rail"] .game { flex: 0 0 200px; scroll-snap-align: start; }
.plist { padding: 4px 6px; }
.prow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 8px 10px; border: 0; background: none; text-align: left; }
.prow + .prow { border-top: 1px solid var(--line); }
.prow .logo { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--season-soft); color: var(--season-ink); font-size: 18px; font-weight: 900; }
.prow .txt { flex: 1; }
.prow .txt b { display: block; font-size: 16px; }
.prow .txt span { font-size: 13px; color: var(--muted); }

/* ── 마이페이지 ── */
.profile { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.profile .avatar { width: 52px; height: 52px; font-size: 20px; }
.profile .who { flex: 1; }
.profile .who b { display: block; font-size: 19px; font-weight: 900; }
.rank { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--ink); color: var(--brand); font-size: 12px; font-weight: 800; }
.event { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 132px; margin: 12px 16px 0; padding: 20px; overflow: hidden; border-radius: 26px; color: #fff; background: linear-gradient(120deg, var(--hero-a), var(--hero-b)); }
.event .scene { position: absolute; right: -20px; bottom: -30px; width: 200px; height: 160px; pointer-events: none; }
.event .scene svg { width: 100%; height: 100%; }
.event > *:not(.scene) { position: relative; }
.event .k { font-size: 13px; font-weight: 700; }
.event .t { font-size: 26px; line-height: 1.2; font-weight: 900; letter-spacing: -.02em; }
.event .btn { margin-top: 10px; }
.shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 16px 0; }
.sc { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 14px; border: 0; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); text-align: left; font-size: 15px; font-weight: 700; }
.sc__ic { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 14px; background: var(--sc-bg); color: var(--sc-ink); }
.sc__ic .ic { width: 22px; height: 22px; }
[data-shortcuts="circles"] .shortcuts { grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 16px 4px 8px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
[data-shortcuts="circles"] .sc { flex-direction: column; gap: 8px; min-height: 0; padding: 6px 0; background: none; box-shadow: none; text-align: center; font-size: 13px; }
[data-shortcuts="circles"] .sc__ic { width: 56px; height: 56px; border-radius: 50%; }
[data-shortcuts="circles"] .sc__ic .ic { width: 26px; height: 26px; }
.notice { display: flex; align-items: center; gap: 12px; margin: 12px 16px 0; padding: 14px 16px; border-radius: 20px; background: var(--season-soft); color: var(--season-ink); font-size: 14px; font-weight: 500; }
.notice span { flex: 1; }
.notice button { min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--season-ink); font-weight: 800; text-decoration: underline; }
.menu { margin: 12px 16px 0; padding: 4px 6px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
.menu .prow { min-height: 54px; font-size: 16px; font-weight: 500; }
.menu .prow .ic { width: 22px; height: 22px; color: #9A948A; }
.menu .prow span { flex: 1; }
.menu-end { display: block; width: calc(100% - 32px); min-height: 52px; margin: 12px 16px 28px; border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; }

/* ── 박스 상세 ── */
.hero { position: relative; height: 336px; overflow: hidden; background: linear-gradient(170deg, var(--hero-a), var(--hero-b)); }
.hero .scene { position: absolute; inset: 0; }
.hero .scene svg { width: 100%; height: 100%; }
.hero .back { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, .92); color: var(--ink); }
.sheet { position: relative; margin-top: -28px; padding: 24px 20px 4px; border-radius: 28px 28px 0 0; background: var(--bg); }
.sheet .h1 { margin-bottom: 6px; }
.sheet .desc { margin: 0 0 14px; font-size: 15px; color: var(--muted); }
.price-row { display: flex; align-items: center; justify-content: space-between; }
.price { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.balance { display: flex; align-items: center; gap: 12px; margin: 16px 0 0; padding: 14px 16px; border-radius: 20px; background: var(--ink); color: #fff; }
.balance .coin { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-size: 15px; font-weight: 900; }
.balance b { display: block; font-size: 16px; }
.balance span { font-size: 13px; color: var(--brand); }
.info { margin: 16px 0 0; padding: 4px 18px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
.info details { border-bottom: 1px solid var(--line); }
.info details:last-child { border-bottom: 0; }
.info summary { display: flex; align-items: center; justify-content: space-between; min-height: 52px; font-size: 15px; font-weight: 700; cursor: pointer; list-style: none; }
.info summary::-webkit-details-marker { display: none; }
.info summary .ic { width: 20px; height: 20px; transition: transform .2s; }
.info details[open] summary .ic { transform: rotate(180deg); }
.info .dd { padding: 0 0 14px; font-size: 14px; color: var(--muted); line-height: 1.65; }
.prizes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.prize { overflow: hidden; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
.prize__img { position: relative; display: grid; place-items: center; height: 104px; background: radial-gradient(circle at 50% 60%, var(--glow), rgba(0, 0, 0, 0) 70%), var(--hero-a); }
.prize__img .art { width: 70px; height: 70px; }
.prize__img .medal { position: absolute; top: 10px; left: 10px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--m, var(--gold)); color: #1A1208; font-size: 13px; font-weight: 900; }
.prize__t { padding: 12px 14px 14px; }
.prize__t b { display: block; font-size: 16px; }
.prize__t span { font-size: 13px; color: var(--muted); }
.buybar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); box-shadow: 0 -8px 24px rgba(30, 20, 10, .08); }
.stepper { display: flex; align-items: center; flex: none; border: 1.5px solid var(--line); border-radius: 999px; }
.stepper button { display: grid; place-items: center; width: 44px; height: 48px; border: 0; background: none; font-size: 20px; font-weight: 700; }
.stepper button:disabled { color: #B9B3A9; cursor: default; }
.stepper output { min-width: 24px; text-align: center; font-size: 17px; font-weight: 800; }
.buybar .btn { flex: 1; min-height: 52px; padding: 0 12px; font-size: 16px; }

/* ── 내보관함 ── */
.vhead { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 4px; }
.vhead .h1 { font-size: 24px; }
.vhead .pt { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 500; }
.vhead .pt .ic { width: 18px; height: 18px; fill: var(--muted); stroke: var(--bg); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 10px 16px 0; padding: 4px; border-radius: 999px; background: var(--line); }
.seg button { min-height: 40px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-size: 14px; font-weight: 500; }
.seg button[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 800; box-shadow: 0 1px 4px rgba(30, 20, 10, .12); }
.synth-banner { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 16px 0; padding: 18px 20px; overflow: hidden; border-radius: 24px; color: #fff; background: linear-gradient(120deg, var(--hero-a), var(--hero-b)); }
.synth-banner b { display: block; font-size: 18px; font-weight: 900; }
.synth-banner span { font-size: 13px; }
.synth-banner button { position: relative; min-height: 44px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, .3); border-radius: 999px; background: rgba(0, 0, 0, .2); color: #fff; font-size: 13px; font-weight: 700; }
.ladder { display: flex; flex-direction: column; gap: 12px; margin: 14px 16px 0; }
.step { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 4px 14px; padding: 16px; border-radius: 24px; background: var(--p-bg); }
.step .ticon { display: grid; place-items: center; grid-row: span 2; width: 64px; height: 64px; border-radius: 20px; background: var(--p-btn); color: var(--p-btn-ink); box-shadow: inset 0 3px 6px rgba(255, 255, 255, .35), inset 0 -4px 8px rgba(0, 0, 0, .12); }
.step .ticon .ic { width: 32px; height: 32px; }
.step .tt { align-self: end; }
.step .tt b { font-size: 18px; font-weight: 800; }
.step .tt span { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, .7); color: var(--ink); font-size: 12px; font-weight: 700; }
.step .cost { align-self: end; font-size: 18px; font-weight: 900; color: var(--p-ink); }
.step .gauge { grid-column: 2; align-self: start; }
.step .gauge small { display: block; margin-bottom: 4px; font-size: 12px; color: var(--p-ink); }
.step .gauge .bar { height: 8px; background: rgba(255, 255, 255, .7); }
.step .gauge .bar i { background: var(--p-btn); }
.step .go { grid-column: 3; align-self: start; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--p-btn); color: var(--p-btn-ink); font-size: 14px; font-weight: 800; }
.step--final { position: relative; overflow: hidden; color: var(--gold); background: var(--ink); }
.step--final .ticon { background: var(--gold); color: #1A1208; }
.step--final .tt b, .step--final .cost { color: var(--gold); }
.step--final .tt span { background: rgba(255, 255, 255, .14); color: #E8E2D6; }
.step--final .gauge small { color: var(--gold); }
.step--final .gauge .bar { background: rgba(255, 255, 255, .16); }
.step--final .gauge .bar i { background: var(--gold); }
.step--final .go { background: var(--gold); color: #1A1208; }
.chips { display: flex; gap: 8px; margin: 14px 0 0; padding: 0 16px; overflow-x: auto; }
.chip { flex: none; min-height: 40px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; font-weight: 700; }
.search { display: flex; align-items: center; gap: 10px; height: 50px; margin: 12px 16px 0; padding: 0 18px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16px; }
.search input:focus-visible { outline: none; }
.search:focus-within { outline: 3px solid #1B64F2; outline-offset: 2px; }
.search .ic { color: var(--muted); }
.sortbar { display: flex; align-items: center; justify-content: space-between; margin: 12px 20px 8px; }
.sortbar .left { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.sortbar .left button { min-height: 44px; padding: 0; border: 0; background: none; font-weight: 700; }
.sortbar .count b { color: var(--season); }
.chk { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.chk input { position: absolute; opacity: 0; width: 44px; height: 44px; margin: -10px; cursor: pointer; }
.chk .box { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border: 2px solid #CFC9BF; border-radius: 8px; background: var(--surface); color: transparent; }
.chk .box .ic { width: 16px; height: 16px; stroke-width: 3; }
.chk input:checked + .box { border-color: var(--season); background: var(--season); color: #fff; }
.chk input:focus-visible + .box { outline: 3px solid #1B64F2; outline-offset: 2px; }
.items { display: flex; flex-direction: column; gap: 10px; margin: 0 16px; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid transparent; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
.item.is-sel { border-color: var(--season); }
.item .th { display: grid; place-items: center; flex: none; width: 68px; height: 68px; border-radius: 16px; background: var(--t, #EEE); color: rgba(0, 0, 0, .3); }
.item .th .ic { width: 28px; height: 28px; }
.item .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; }
.tag { display: inline-block; margin-bottom: 2px; padding: 0 8px; border-radius: 999px; background: var(--tg-bg); color: var(--tg-ink); font-size: 12px; font-weight: 700; }
.item .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .pr { display: block; margin-top: 2px; font-size: 16px; font-weight: 800; }
.actionbar { position: sticky; bottom: 92px; z-index: 3; display: none; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 16px 0; padding: 10px 10px 10px 18px; border-radius: 999px; background: var(--ink); color: #fff; box-shadow: 0 10px 28px rgba(20, 12, 4, .3); }
.actionbar.is-on { display: flex; }
.actionbar b { font-size: 14px; }
.actionbar .btns { display: flex; gap: 6px; }
.actionbar .btn { min-height: 44px; padding: 0 16px; font-size: 14px; }
[data-vault="grid"] .items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
[data-vault="grid"] .item { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
[data-vault="grid"] .item .th { width: 100%; height: auto; aspect-ratio: 1; }
[data-vault="grid"] .item .th .ic { width: 38px; height: 38px; }
.placeholder { display: grid; place-items: center; min-height: 520px; padding: 24px; color: var(--muted); text-align: center; }

/* ── 하단 탭 ── */
.tabbar { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 66px; padding: 6px; border-radius: 33px; background: var(--surface); box-shadow: 0 12px 32px rgba(20, 12, 4, .18), 0 0 0 1px rgba(20, 12, 4, .04); }
.tabbar[hidden] { display: none; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 27px; background: none; color: #4D4840; font-size: 11.5px; }
.tab .ic { width: 24px; height: 24px; }
.tab[aria-current="page"] { background: var(--season-soft); color: var(--season-ink); font-weight: 800; }
.tab .dot { position: absolute; top: 8px; left: calc(50% + 6px); width: 8px; height: 8px; border-radius: 50%; background: #E0343F; }
[data-nav="dock"] .tabbar { left: 0; right: 0; bottom: 0; height: 72px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-radius: 0; box-shadow: 0 -1px 0 var(--line); }
[data-nav="dock"] .tab { border-radius: 0; }
[data-nav="dock"] .tab[aria-current="page"] { background: none; color: var(--season); box-shadow: inset 0 3px 0 var(--season); }
[data-nav="dock"] .actionbar { bottom: 82px; }
</style>

        h('div', { class: 'info' },
          acc('결제 조건', h('div', {}, '기본 구매: 박스 1개당 카카오빈 100개 차감', h('br'), '추가 구매: 박스 1개당 카카오빈 200개 차감'), true),
          acc('최대 구매 수량', h('div', {}, '기본 구매: 최대 10개(회차 오픈 시)', h('br'), '추가 구매: 최대 4개(회차 오픈 1시간 후)', h('br'), '총 14개 박스까지 구매 가능'), true),
          acc('상품 정보 · 배송비', h('div', {}, '상품정보: 하단의 상세설명 참조', h('br'), '배송비: 초콜릿박스 배송정책에 따름'))),
        h('h2', { class: 'h2', style: 'margin:28px 4px 12px', text: '상품 구성' }),
        h('div', { class: 'prizes' }, prize('1등', '50~60만원 미만의 상품', '1', 'var(--gold)'), prize('2등', '10~11만원 미만의 상품', '2', '#D8D8D8'))),
      h('div', { class: 'buybar' }, h('div', { class: 'stepper' }, minus, out, plus), buy)
    );
  }

  /* ── 내보관함 ── */
  function vault(kind) {
    const t = theme(), p = t.pastels;
    const tab = (label, key, to) => h('button', { type: 'button', 'aria-current': key === kind ? 'page' : null, onClick: () => go(to) }, label);
    const head = [
      h('header', { class: 'vhead' }, h('h1', { class: 'h1', text: '내 보관함' }), h('button', { class: 'pt', type: 'button' }, '교환포인트', icon('info'))),
      h('nav', { class: 'seg', 'aria-label': '보관함 구분' }, tab('보유상품', 'own', 'vault-items'), tab('선물함', 'gift', 'vault-items'), tab('내보관함', 'items', 'vault-items'), tab('합성존', 'synth', 'vault-synth'))
    ];
    if (kind === 'synth') {
      const steps = CONTENT.steps.map((s, i) => {
        const c = p[i];
        return h('section', { class: 'step', style: `--p-bg:${c.bg};--p-ink:${c.ink};--p-btn:${c.btn};--p-btn-ink:${c.btnInk}` },
          h('span', { class: 'ticon' }, icon(s.icon, 'fill')),
          h('div', { class: 'tt' }, h('b', { text: s.name }), h('span', { text: '남은 합성 ' + s.left })),
          h('span', { class: 'cost', text: s.cost }),
          h('div', { class: 'gauge' }, h('small', { text: '합성 충족 게이지' }), h('div', { class: 'bar', role: 'img', 'aria-label': '충족 게이지' }, h('i', { style: `width:${[62, 38, 24, 12][i]}%` }))),
          h('button', { class: 'go', type: 'button', text: '합성하기' }));
      });
      steps.push(h('section', { class: 'step step--final' },
        h('span', { class: 'ticon' }, icon('gem', 'fill')),
        h('div', { class: 'tt' }, h('b', { text: '스텝5' }), h('span', { text: '남은 합성 10' })),
        h('span', { class: 'cost', text: '298,000P' }),
        h('div', { class: 'gauge' }, h('small', { text: '합성 충족 게이지' }), h('div', { class: 'bar', role: 'img', 'aria-label': '충족 게이지' }, h('i', { style: 'width:6%' }))),
        h('button', { class: 'go', type: 'button', text: '합성하기' })));
      return h('div', { class: 'screen' }, head,
        h('section', { class: 'synth-banner' }, h('div', {}, h('b', { text: '스텝을 모아 더 큰 상품으로' }), h('span', { text: '합성 충족 게이지를 채우면 합성할 수 있어요' })), h('button', { type: 'button', text: '사용방법' })),
        h('div', { class: 'ladder' }, steps));
    }
    const selected = new Set();
    const bar = h('div', { class: 'actionbar', role: 'region', 'aria-label': '선택한 상품 작업' });
    const barCount = h('b');
    const refresh = () => { bar.classList.toggle('is-on', selected.size > 0); barCount.textContent = `${selected.size}개 선택`; };
    bar.append(barCount, h('div', { class: 'btns' }, h('button', { class: 'btn btn--primary', type: 'button', text: '배송 신청' }), h('button', { class: 'btn btn--soft', type: 'button', text: '현금화' })));
    const checks = [];
    const items = CONTENT.items.map((it, i) => {
      const tg = CONTENT.tags[it.tag];
      const input = h('input', { type: 'checkbox', 'aria-label': it.name + ' 선택' });
      const card = h('div', { class: 'item' },
        h('label', { class: 'chk' }, input, h('span', { class: 'box' }, icon('check'))),
        h('span', { class: 'th', style: `--t:${it.tone}` }, icon('gift')),
        h('div', { class: 'tx' }, h('span', { class: 'tag', style: `--tg-bg:${tg.bg};--tg-ink:${tg.ink}`, text: tg.label }), h('span', { class: 'nm', text: it.name }), h('span', { class: 'pr', text: it.price })));
      input.addEventListener('change', () => { card.classList.toggle('is-sel', input.checked); input.checked ? selected.add(i) : selected.delete(i); refresh(); });
      checks.push(input);
      return card;
    });
    const all = h('input', { type: 'checkbox' });
    all.addEventListener('change', () => checks.forEach((c, i) => { c.checked = all.checked; c.dispatchEvent(new Event('change')); }));
    refresh();
    return h('div', { class: 'screen' }, head,
      h('div', { class: 'chips' }, CONTENT.chips.map((c, i) => h('button', { class: 'chip', type: 'button', 'aria-pressed': String(i === 0), text: c }))),
      h('label', { class: 'search' }, icon('search'), h('span', { class: 'sr-only', text: '상품검색' }), h('input', { type: 'search', placeholder: '상품검색' })),
      h('div', { class: 'sortbar' },
        h('div', { class: 'left' }, h('button', { type: 'button' }, '최신 순 ▾'), h('span', { class: 'count' }, '전체 ', h('b', { text: '407개' }))),
        h('label', { class: 'chk' }, all, h('span', { class: 'box' }, icon('check')), '전체선택')),
      h('div', { class: 'items' }, items),
      bar);
  }

  const placeholder = (label) => h('div', { class: 'screen' }, h('div', { class: 'placeholder', text: label + ' 화면은 전달받은 스크린샷에 없어 시안에서 제외했어요.' }));
  const BUILD = { apptech: appTech, mypage, box: boxDetail, 'vault-synth': () => vault('synth'), 'vault-items': () => vault('items'), home: () => placeholder('Home'), news: () => placeholder('뉴스룸') };
  const TABS = [
    { label: 'Home', icon: 'home', to: 'home' },
    { label: '뉴스룸', icon: 'news', to: 'news', dot: true },
    { label: '박스구매', icon: 'gift', to: 'box' },
    { label: '내보관함', icon: 'box', to: 'vault-items', on: (s) => s.startsWith('vault') },
    { label: '앱테크', icon: 'diamond', to: 'apptech' }
  ];

  function render() {
    const t = theme();
    Object.entries(t.tokens).forEach(([k, v]) => root.style.setProperty('--' + k, v));
    root.dataset.theme = state.quarter;
    $('meta[name="theme-color"]').setAttribute('content', t.tokens.bg);
    KEYS.forEach((k) => { $('#app').dataset[k] = state[k] === 'auto' ? t.layout[k] : state[k]; $('#sel-' + k).value = state[k]; });
    $('#screens').replaceChildren(BUILD[state.screen]());
    const tabbed = TABBED(state.screen);
    $('#app').classList.toggle('has-tabs', tabbed);
    const tabbar = $('#tabbar');
    tabbar.hidden = !tabbed;
    tabbar.replaceChildren(...TABS.map((tab) => {
      const on = tab.on ? tab.on(state.screen) : state.screen === tab.to;
      return h('button', { class: 'tab', type: 'button', 'aria-current': on ? 'page' : null, onClick: () => go(tab.to) }, icon(tab.icon), tab.dot ? h('span', { class: 'dot' }) : null, tab.label);
    }));
    document.querySelectorAll('#quarters button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.q === state.quarter)));
    $('#sel-screen').value = ['apptech', 'mypage', 'box', 'vault-synth', 'vault-items'].includes(state.screen) ? state.screen : 'apptech';
    $('#panel-name').textContent = t.label;
  }

  function sync() {
    const next = new URLSearchParams(location.search);
    next.set('theme', state.quarter);
    next.set('screen', state.screen);
    KEYS.forEach((k) => (state[k] === 'auto' ? next.delete(k) : next.set(k, state[k])));
    try { history.replaceState(null, '', '?' + next.toString()); } catch (e) { /* file:// 등에서는 건너뜀 */ }
  }

  document.querySelectorAll('#quarters button').forEach((b) => b.addEventListener('click', () => { state.quarter = b.dataset.q; render(); sync(); }));
  $('#sel-screen').addEventListener('change', (e) => go(e.target.value));
  KEYS.forEach((k) => $('#sel-' + k).addEventListener('change', (e) => { state[k] = e.target.value; render(); sync(); }));

  if (params.get('preview') === '0') $('#stage').classList.add('no-panel');
  if (params.get('full') === '1') $('#app').classList.add('is-full');
  render();
})();
</script>
</body>
</html>
