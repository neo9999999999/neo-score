name: Market Report Backfill (OOS)

# 과거 일자별 OOS 리포트 백필 + 분석.
# 수동 실행 전용. 시작일을 입력해 그 시점부터 어제까지 누적 생성한다.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "백필 시작일 (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"

permissions:
  contents: write

concurrency:
  group: market-report-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run backfill
        run: node scripts/backfill-market-reports.mjs "${{ inputs.start }}"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market-report-history.json public/reports
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "Backfill OOS market reports from ${{ inputs.start }}"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "push 성공"; break; fi
              echo "push 실패 ($i/5) — 원격 변경 rebase 후 재시도"
              git pull --rebase origin main || git rebase --abort || true
              sleep $((i * 3))
            done
            if [ "$ok" != "1" ]; then echo "::error::5회 재시도 후에도 push 실패"; exit 1; fi
          fi
