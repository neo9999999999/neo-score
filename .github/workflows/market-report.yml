name: Daily Market Report

# 매일 장 시작 전(07:00 KST 이전) 리포트 생성
# 20:30 UTC = 05:30 KST  → 오전 7시 전에 준비 완료
on:
  schedule:
    - cron: "30 20 * * *"   # 05:30 KST — 주 실행
    - cron: "0 21 * * *"    # 06:00 KST — 백업(스케줄 누락 대비, 변경 없으면 skip)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate market report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/generate-market-report.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market-report.json public/market-report-history.json public/reports
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            DATE=$(date -u -d '+9 hours' +%Y-%m-%d)
            git commit -m "Daily market report ${DATE}"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "push 성공"; break; fi
              echo "push 실패 ($i/5) — 원격 변경 rebase 후 재시도"
              git pull --rebase origin main || git rebase --abort || true
              sleep $((i * 3))
            done
            if [ "$ok" != "1" ]; then echo "::error::5회 재시도 후에도 push 실패"; exit 1; fi
          fi
